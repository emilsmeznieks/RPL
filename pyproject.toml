[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rpl-research"
version = "0.3.0"
description = "Turn research papers into focused knowledge for humans and AI agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["certifi>=2024.7.4"]
license = "MIT"
authors = [{ name = "emilsmeznieks" }]
keywords = ["arxiv", "research", "papers", "agents", "knowledge"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.scripts]
rpl = "rpl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
source = ["rpl"]
